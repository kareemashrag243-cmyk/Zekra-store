<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, minimal-ui">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1A080F">
  <title>Velvet Memories · romantic memory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1A080F;
      --card: #2B101B;
      --rose: #C98A9B;
      --rose-light: #E5B5C1;
      --cream: #F5E6E8;
      --gold: #D6A6AF;
      --glow: rgba(201, 138, 155, 0.35);
      --border: rgba(229, 181, 193, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--cream);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .scroll-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    .opening {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      z-index: 10;
      pointer-events: none;
    }

    .opening-inner {
      text-align: center;
      pointer-events: auto;
    }

    .glow-title {
      font-family: 'Playfair Display', serif;
      font-weight: 300;
      font-size: clamp(2.6rem, 12vw, 5.5rem);
      letter-spacing: 0.12em;
      color: var(--cream);
      text-shadow: 0 0 30px rgba(201, 138, 155, 0.4), 0 0 60px rgba(130, 50, 75, 0.3);
      animation: fadeGlow 2.8s ease-out forwards;
      opacity: 0;
      transform: scale(0.96);
      margin-bottom: 0.4rem;
    }

    .sub-invite {
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-size: 0.9rem;
      color: var(--rose-light);
      background: rgba(201, 138, 155, 0.05);
      backdrop-filter: blur(4px);
      padding: 0.6rem 2rem;
      border-radius: 60px;
      border: 0.5px solid var(--border);
      margin-top: 1rem;
      opacity: 0;
      animation: fadeUp 1.8s 1.4s forwards;
    }

    @keyframes fadeGlow {
      0% { opacity: 0; transform: scale(0.94); filter: blur(4px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .music-toggle {
      position: fixed;
      bottom: 30px;
      right: 24px;
      z-index: 999;
      background: rgba(43, 16, 27, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 0.5px solid var(--border);
      border-radius: 60px;
      padding: 10px 18px;
      color: var(--cream);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      font-weight: 300;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .music-toggle:hover {
      background: rgba(70, 25, 45, 0.8);
      border-color: var(--rose);
    }

    .memory-track {
      position: relative;
      width: 100%;
      padding: 6rem 0 4rem 0;
      background: transparent;
      z-index: 5;
      overflow: hidden;
    }

    .card-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 2rem;
      padding: 0 4vw;
      margin: 3rem 0;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      position: relative;
      touch-action: pan-y;
    }

    .memory-card {
      flex: 0 0 auto;
      width: min(320px, 70vw);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
      background: var(--card);
      transform: scale(0.92) translate3d(0, 0, 0);
      opacity: 0.7;
      cursor: pointer;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s ease, box-shadow 0.5s ease;
      will-change: transform, opacity;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      touch-action: manipulation;
    }

    .memory-card img {
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .memory-card.active {
      transform: scale(1) translateY(-6px) translate3d(0, 0, 0);
      opacity: 1;
      box-shadow: 0 30px 80px rgba(130, 50, 75, 0.4);
    }

    .memory-card:active {
      transform: scale(0.96);
      transition-duration: 0.1s;
    }

    .quote-float {
      font-family: 'Playfair Display', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      color: var(--rose-light);
      text-align: center;
      padding: 2.5rem 1.5rem;
      letter-spacing: 0.03em;
      background: linear-gradient(135deg, rgba(43,16,27,0.5), rgba(26,8,15,0.7));
      backdrop-filter: blur(4px);
      border-radius: 60px;
      margin: 1.5rem auto;
      max-width: 600px;
      border: 0.5px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: opacity 0.3s;
    }

    .scroll-message {
      max-width: 800px;
      margin: 2rem auto 4rem auto;
      padding: 2rem 1.5rem;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-weight: 300;
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      color: var(--cream);
      background: rgba(43, 16, 27, 0.6);
      backdrop-filter: blur(6px);
      border-radius: 60px;
      border: 0.5px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1s ease, transform 1s ease;
      line-height: 1.6;
      letter-spacing: 0.02em;
      position: relative;
      z-index: 6;
    }

    .scroll-message.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .scroll-message .heart-icon {
      color: var(--rose);
      display: inline-block;
      animation: pulseGlow 2s infinite alternate;
    }

    .portrait-section {
      position: relative;
      min-height: 110vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 40%, #351722 0%, #1A080F 100%);
      padding: 2rem 1rem;
      margin: 0 0 2rem 0;
      z-index: 8;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .portrait-wrapper {
      position: relative;
      width: min(500px, 92%);
      max-width: 560px;
      aspect-ratio: 3/4;
      border-radius: 48px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,0.7), 0 0 0 1px rgba(201, 138, 155, 0.2);
      transition: box-shadow 0.8s;
      background: var(--card);
    }

    .portrait-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: blur(32px) brightness(0.6);
      transition: filter 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 1.2s;
      transform: scale(1.06);
    }

    .portrait-wrapper.unlocked img {
      filter: blur(0px) brightness(1);
      transform: scale(1);
    }

    .floating-note {
      position: absolute;
      font-family: 'Playfair Display', serif;
      font-weight: 300;
      font-style: italic;
      color: var(--cream);
      background: rgba(26, 8, 15, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      border: 0.3px solid var(--border);
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
      pointer-events: none;
      white-space: nowrap;
    }

    .note1 { top: 8%; left: -8%; transform: rotate(-6deg); }
    .note2 { bottom: 15%; right: -10%; transform: rotate(5deg); }
    .note3 { top: 30%; right: -6%; transform: rotate(8deg); }
    .note4 { bottom: 30%; left: -12%; transform: rotate(-4deg); }
    .note5 { top: 55%; left: -6%; transform: rotate(2deg); }

    .golden-lock {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 30% 30%, #F5DDE3, #C98A9B);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 40px rgba(201, 138, 155, 0.5), 0 0 80px rgba(130, 50, 75, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 20;
      border: 1px solid var(--rose-light);
      color: #1A080F;
      font-size: 2.4rem;
      font-weight: 300;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .golden-lock:hover {
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 0 70px rgba(201, 138, 155, 0.7);
    }

    .golden-lock:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .golden-lock.unlocked {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.5);
      transition: 0.6s;
    }

    .petal-burst {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      bottom: -10%;
      width: 30px;
      height: 30px;
      border-radius: 60% 20% 60% 20%;
      opacity: 0;
      animation: risePetal linear forwards;
      filter: blur(0.5px);
    }

    @keyframes risePetal {
      0% { opacity: 0; transform: translateY(0) rotate(0deg) scale(0.6); }
      15% { opacity: 0.95; }
      90% { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-120vh) rotate(720deg) scale(1.3); }
    }

    .final-message {
      text-align: center;
      padding: 4rem 1.5rem 6rem;
      background: radial-gradient(circle at 50% 80%, #351722, #1A080F);
      margin-top: -2px;
      border-top: 0.5px solid var(--border);
      z-index: 6;
      position: relative;
    }

    .final-message h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 300;
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      color: var(--cream);
      text-shadow: 0 0 40px rgba(201, 138, 155, 0.3);
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    .final-message h2.show {
      opacity: 1;
      transform: translateY(0);
    }

    .glowing-heart {
      font-size: 3.8rem;
      margin-top: 1.8rem;
      animation: pulseGlow 2s infinite alternate;
      opacity: 0;
      transition: opacity 2s;
    }

    .glowing-heart.show {
      opacity: 1;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px #C98A9B, 0 0 30px #9E526B; transform: scale(1); }
      100% { text-shadow: 0 0 30px #E5B5C1, 0 0 80px #9E526B; transform: scale(1.1); }
    }

    /* LIGHTBOX GALLERY */
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 4, 9, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }

    .lightbox-overlay.show {
      display: flex;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .lightbox-frame {
      position: relative;
      width: min(600px, 95%);
      max-width: 700px;
      background: rgba(43, 16, 27, 0.8);
      border-radius: 32px;
      padding: 16px;
      box-shadow: 0 40px 120px rgba(0,0,0,0.8), 0 0 0 1px var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .lightbox-frame img {
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 20px;
      display: block;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .lightbox-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 18px;
      width: 100%;
    }

    .lightbox-btn {
      background: rgba(201, 138, 155, 0.08);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--cream);
      font-size: 1.4rem;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .lightbox-btn:hover {
      background: rgba(201, 138, 155, 0.2);
      border-color: var(--rose);
      transform: scale(1.05);
    }

    .lightbox-btn:active {
      transform: scale(0.92);
    }

    .lightbox-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      transform: none;
    }

    .lightbox-counter {
      font-size: 0.8rem;
      color: rgba(245, 230, 232, 0.5);
      letter-spacing: 0.1em;
      min-width: 60px;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: -10px;
      right: -10px;
      background: rgba(43, 16, 27, 0.9);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--cream);
      font-size: 1.2rem;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    .lightbox-close:hover {
      background: rgba(160, 60, 90, 0.4);
      border-color: var(--rose);
      transform: scale(1.05);
    }

    .lightbox-close:active {
      transform: scale(0.9);
    }

    @media (max-width: 640px) {
      .floating-note { font-size: 0.7rem; padding: 0.2rem 0.8rem; }
      .note1 { top: 6%; left: -4%; }
      .note2 { bottom: 10%; right: -6%; }
      .note3 { top: 25%; right: -4%; }
      .note4 { bottom: 25%; left: -6%; }
      .note5 { top: 50%; left: -4%; }
      .golden-lock { width: 64px; height: 64px; font-size: 2rem; }
      .memory-card { width: min(260px, 80vw); }
      .quote-float { font-size: 1.2rem; padding: 1.8rem 1rem; }
      .lightbox-frame { padding: 12px; border-radius: 24px; }
      .lightbox-btn { width: 44px; height: 44px; font-size: 1.2rem; }
      .lightbox-close { width: 34px; height: 34px; font-size: 1rem; top: -6px; right: -6px; }
      .scroll-message {
        margin: 1rem 1rem 2rem 1rem;
        padding: 1.5rem 1rem;
        font-size: clamp(1.2rem, 5vw, 2rem);
      }
    }

    @media (max-width: 400px) {
      .memory-card { width: min(200px, 85vw); }
      .card-row { gap: 1rem; padding: 0 2vw; }
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--rose); border-radius: 20px; }
    ::-webkit-scrollbar:horizontal { display: none; }

    .glass-badge {
      background: rgba(43, 16, 27, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 0.5px solid var(--border);
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>
  <div class="music-toggle" id="musicToggle">♫  ambient</div>

  <div class="scroll-container">

    <section class="opening" id="opening">
      <div class="opening-inner">
        <h1 class="glow-title">eternal petals</h1>
        <div class="sub-invite">↓  scroll to remember  ↓</div>
      </div>
    </section>

    <div class="memory-track" id="memoryTrack">
      <div class="card-row" id="cardRow1" data-row="0">
        <div class="memory-card" data-index="0"><img src="/images/love1.jpeg" alt="memory"></div>
        <div class="memory-card" data-index="1"><img src="/images/love2.jpeg" alt="memory"></div>
        <div class="memory-card" data-index="2"><img src="/images/love3.jpeg" alt="memory"></div>
        <div class="memory-card" data-index="3"><img src="/images/love4.jpeg" alt="memory"></div>
        <div class="memory-card" data-index="4"><img src="/images/love6.jpeg" alt="memory"></div>
        <div class="memory-card" data-index="5"><img src="/images/love7.jpeg" alt="memory"></div>
      </div>

      <div class="quote-float">“in your eyes, i found infinity”</div>

      <div class="card-row" id="cardRow2" data-row="1">
        <div class="memory-card" data-index="0"><img src="IMG-20260814-WA0030.jpg" alt="memory"></div>
        <div class="memory-card" data-index="1"><img src="/images/love9.jpeg" alt="memory"></div>
        <div class="memory-card" data-index="2"><img src="/images/love10.jpeg" alt="memory"></div>
        <div class="memory-card" data-index="3"><img src="/images/love11.jpeg" alt="memory"></div>
        <div class="memory-card" data-index="4"><img src="/images/love12.jpeg" alt="memory"></div>
        <div class="memory-card" data-index="5"><img src="/images/love13.jpeg" alt="memory"></div>
      </div>
    </div>

    <div class="scroll-message" id="scrollMessage">
      <span class="heart-icon">♥</span>
      <br>
      every moment with you waters the garden of the soul<br>
      <span style="font-size:0.7em; opacity:0.7;">— a message from the heart —</span>
    </div>

    <div class="portrait-section" id="portraitSection">
      <div class="portrait-wrapper" id="portraitWrapper">
        <img src="/images/love5.jpeg" alt="hidden portrait">
        <span class="floating-note note1">✦  june 12, 2023</span>
        <span class="floating-note note2">✧  your laugh</span>
        <span class="floating-note note3">✦  midnight rain</span>
        <span class="floating-note note4">✧  forever</span>
        <span class="floating-note note5">✦  luna</span>
        <div class="golden-lock" id="goldenLock">🔒</div>
      </div>
    </div>

    <div class="final-message" id="finalMessage">
      <h2 id="loveMessage">you are my eternal bloom</h2>
      <div class="glowing-heart" id="heartGlow">♥</div>
    </div>
  </div>

  <div class="petal-burst" id="petalBurst"></div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <div class="lightbox-frame" id="lightboxFrame">
      <button class="lightbox-close" id="lightboxClose">✕</button>
      <img id="lightboxImage" src="" alt="gallery image">
      <div class="lightbox-nav">
        <button class="lightbox-btn" id="lightboxPrev">‹</button>
        <span class="lightbox-counter" id="lightboxCounter">1 / 6</span>
        <button class="lightbox-btn" id="lightboxNext">›</button>
      </div>
    </div>
  </div>

  <audio id="romanticAudio" preload="auto">
    <source src="/audio/lo3e.mp3" type="audio/mpeg">
  </audio>

  <script>
    (function() {
      "use strict";

      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let w, h;

      function resizeParticles() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeParticles);
      resizeParticles();

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 2 + 0.6;
          this.speedX = (Math.random() - 0.5) * 0.15;
          this.speedY = (Math.random() - 0.5) * 0.15;
          this.opacity = Math.random() * 0.4 + 0.15;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w) this.speedX *= -1;
          if (this.y < 0 || this.y > h) this.speedY *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(229, 181, 193, ${this.opacity})`;
          ctx.fill();
        }
      }

      const particleCount = window.innerWidth < 480 ? 60 : 100;
      for (let i = 0; i < particleCount; i++) particles.push(new Particle());

      function animateParticles() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
      }
      animateParticles();

      const musicBtn = document.getElementById('musicToggle');
      const audioPlayer = document.getElementById('romanticAudio');
      let musicOn = false;

      musicBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (musicOn) {
          audioPlayer.pause();
          musicOn = false;
          this.textContent = '♫  ambient';
          this.style.borderColor = 'rgba(229, 181, 193, 0.15)';
          this.style.background = 'rgba(43, 16, 27, 0.7)';
        } else {
          audioPlayer.play().then(() => {
            musicOn = true;
            this.textContent = '♫  romantic ♫';
            this.style.borderColor = '#C98A9B';
            this.style.background = 'rgba(70, 25, 45, 0.8)';
          }).catch(() => {});
        }
      });

      const cardRows = document.querySelectorAll('.card-row');
      const cards = document.querySelectorAll('.memory-card');
      const quoteEl = document.querySelector('.quote-float');

      function updateCards() {
        const scrollY = window.scrollY;
        const windowH = window.innerHeight;

        cardRows.forEach((row, idx) => {
          const speed = 0.15 + idx * 0.03;
          const offset = (scrollY * speed) % row.scrollWidth;
          row.style.transform = `translate3d(-${offset}px, 0, 0)`;
        });

        cards.forEach(card => {
          const rect = card.getBoundingClientRect();
          const center = rect.top + rect.height / 2;
          const viewCenter = windowH / 2;
          const dist = Math.abs(center - viewCenter);
          const isActive = dist < windowH * 0.3;
          card.classList.toggle('active', isActive);
        });

        if (quoteEl) {
          const qRect = quoteEl.getBoundingClientRect();
          const qCenter = qRect.top + qRect.height / 2;
          const qDist = Math.abs(qCenter - windowH / 2);
          const qOpacity = 1 - Math.min(qDist / (windowH * 0.5), 1) * 0.6;
          quoteEl.style.opacity = Math.max(0.3, qOpacity);
        }
      }

      let ticking = false;
      window.addEventListener('scroll', function() {
        if (!ticking) {
          window.requestAnimationFrame(function() {
            updateCards();
            ticking = false;
          });
          ticking = true;
        }
      });

      window.addEventListener('resize', updateCards);
      setTimeout(updateCards, 100);

      const lightboxOverlay = document.getElementById('lightboxOverlay');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxPrev = document.getElementById('lightboxPrev');
      const lightboxNext = document.getElementById('lightboxNext');
      const lightboxClose = document.getElementById('lightboxClose');
      const lightboxCounter = document.getElementById('lightboxCounter');

      let currentRow = [];
      let currentIndex = 0;

      const rowImages = [];
      cardRows.forEach((row) => {
        const images = [];
        const cards = row.querySelectorAll('.memory-card img');
        cards.forEach(img => images.push(img.src));
        rowImages.push(images);
      });

      function openLightbox(rowIndex, imageIndex) {
        currentRow = rowImages[rowIndex] || [];
        currentIndex = imageIndex;
        if (currentRow.length === 0) return;

        lightboxImage.src = currentRow[currentIndex];
        updateCounter();
        lightboxOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';
        updateButtons();
      }

      function updateCounter() {
        lightboxCounter.textContent = `${currentIndex + 1} / ${currentRow.length}`;
      }

      function updateButtons() {
        lightboxPrev.disabled = currentIndex === 0;
        lightboxNext.disabled = currentIndex === currentRow.length - 1;
      }

      function goToPrev() {
        if (currentIndex > 0) {
          currentIndex--;
          lightboxImage.src = currentRow[currentIndex];
          updateCounter();
          updateButtons();
        }
      }

      function goToNext() {
        if (currentIndex < currentRow.length - 1) {
          currentIndex++;
          lightboxImage.src = currentRow[currentIndex];
          updateCounter();
          updateButtons();
        }
      }

      function closeLightbox() {
        lightboxOverlay.classList.remove('show');
        document.body.style.overflow = '';
      }

      lightboxPrev.addEventListener('click', goToPrev);
      lightboxNext.addEventListener('click', goToNext);
      lightboxClose.addEventListener('click', closeLightbox);

      lightboxOverlay.addEventListener('click', function(e) {
        if (e.target === this) closeLightbox();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') goToPrev();
        if (e.key === 'ArrowRight') goToNext();
      });

      document.querySelectorAll('.memory-card').forEach((card) => {
        const row = card.closest('.card-row');
        const rowIndex = parseInt(row.dataset.row);
        const cardIndex = parseInt(card.dataset.index);

        card.addEventListener('click', function(e) {
          e.stopPropagation();
          openLightbox(rowIndex, cardIndex);
        });

        card.addEventListener('touchstart', function(e) {}, { passive: true });
      });

      const lock = document.getElementById('goldenLock');
      const portraitWrapper = document.getElementById('portraitWrapper');
      const petalBurst = document.getElementById('petalBurst');
      const loveMsg = document.getElementById('loveMessage');
      const heartGlow = document.getElementById('heartGlow');

      let unlocked = false;

      function createPetals(count = 70) {
        const container = petalBurst;
        const roseColors = [
          '#C98A9B', '#D99AAA', '#B76E83', '#E5B5C1',
          '#C57B90', '#E8A5B5', '#A95B72', '#D48B9F',
          '#F0B8C6', '#BD7187', '#AC5B73', '#DFA0B1'
        ];

        const finalCount = window.innerWidth < 480 ? Math.floor(count * 0.5) : count;

        for (let i = 0; i < finalCount; i++) {
          const petal = document.createElement('div');
          petal.className = 'petal';
          const size = 15 + Math.random() * 30;
          petal.style.width = size + 'px';
          petal.style.height = size * 0.8 + 'px';
          petal.style.left = Math.random() * 100 + '%';
          const color = roseColors[Math.floor(Math.random() * roseColors.length)];
          petal.style.background = `radial-gradient(circle at 30% 30%, ${color}, ${darkenColor(color)})`;
          petal.style.borderRadius = `${30 + Math.random()*40}% ${10 + Math.random()*30}% ${40 + Math.random()*30}% ${20 + Math.random()*30}%`;
          petal.style.animationDuration = 5 + Math.random() * 7 + 's';
          petal.style.animationDelay = Math.random() * 2 + 's';
          petal.style.transform = `rotate(${Math.random()*360}deg)`;
          petal.style.boxShadow = `0 0 15px rgba(201, 138, 155, 0.4)`;
          container.appendChild(petal);
        }
        setTimeout(() => { container.innerHTML = ''; }, 13000);
      }

      function darkenColor(hex) {
        let r = parseInt(hex.slice(1,3), 16);
        let g = parseInt(hex.slice(3,5), 16);
        let b = parseInt(hex.slice(5,7), 16);
        r = Math.max(0, r - 60);
        g = Math.max(0, g - 60);
        b = Math.max(0, b - 60);
        return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
      }

      lock.addEventListener('click', function(e) {
        e.stopPropagation();
        if (unlocked) return;
        unlocked = true;

        this.classList.add('unlocked');
        portraitWrapper.classList.add('unlocked');

        audioPlayer.play().then(() => {
          musicOn = true;
          musicBtn.textContent = '♫  romantic ♫';
          musicBtn.style.borderColor = '#C98A9B';
          musicBtn.style.background = 'rgba(70, 25, 45, 0.8)';
        }).catch(() => {});

        const sparkCount = window.innerWidth < 480 ? 25 : 40;
        for (let i = 0; i < sparkCount; i++) {
          const spark = document.createElement('div');
          const roseShade = ['#C98A9B', '#E5B5C1', '#B76E83', '#D48B9F', '#F0B8C6'][Math.floor(Math.random()*5)];
          spark.style.cssText = `
            position: fixed; pointer-events: none; z-index: 60;
            width: ${window.innerWidth < 480 ? 8 : 12}px;
            height: ${window.innerWidth < 480 ? 8 : 12}px;
            border-radius: 50%;
            background: radial-gradient(circle, ${roseShade}, #6D243D);
            left: ${e.clientX || window.innerWidth/2}px;
            top: ${e.clientY || window.innerHeight/2}px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 25px ${roseShade};
            transition: all 1.4s cubic-bezier(0.2, 0.8, 0.3, 1.2);
          `;
          document.body.appendChild(spark);
          const angle = Math.random() * 2 * Math.PI;
          const dist = 80 + Math.random() * 300;
          setTimeout(() => {
            spark.style.transform = `translate(${Math.cos(angle)*dist - 50}px, ${Math.sin(angle)*dist - 50}px) scale(0)`;
            spark.style.opacity = '0';
          }, 20);
          setTimeout(() => spark.remove(), 1800);
        }

        createPetals(80);

        setTimeout(() => {
          loveMsg.classList.add('show');
          heartGlow.classList.add('show');
        }, 800);

        setTimeout(() => createPetals(50), 2500);
        setTimeout(() => createPetals(30), 4500);
      });

      loveMsg.classList.remove('show');
      heartGlow.classList.remove('show');

      const messageEl = document.getElementById('scrollMessage');
      if (messageEl) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              messageEl.classList.add('visible');
            }
          });
        }, {
          threshold: 0.3,
          rootMargin: '0px 0px -50px 0px'
        });
        observer.observe(messageEl);
      }

      console.log('❤️ Velvet Memories — romantic rose theme');
    })();
  </script>
</body>
</html>
